# Publish the packages to npm.
#
# Authentication is npm Trusted Publishing (OIDC): npm trusts this workflow, in
# this repository, and mints a short-lived credential for it. There is no token
# in the repository, in a secret, or on anyone's laptop — which is the point,
# and why this exists instead of an automation token.
#
# Trusted publishing only works from a CI provider's own runners, so this cannot
# be run locally. It replaces publishing by hand.
#
# Before the first run, each package needs a trusted publisher configured at
# npmjs.com → package → Settings → Trusted Publisher: GitHub Actions,
# SYMBIO/mocanvas, workflow `release.yml`.
#
# ## Cutting a release candidate
#
# Set every package's version to a prerelease — `4.4.0-rc.1` — and tag it
# `v4.4.0-rc.1`. This workflow reads the version, sees the `-`, and publishes
# under `next` instead of `latest`, so nobody on a caret range is handed it.
# Everything else is identical: the same gates decide whether it is publishable.
#
# Cut one EARLY, while the version is still being worked on. A consumer whose
# supply-chain policy refuses packages under a day old then has the clock
# running during development rather than after the release, and their findings
# can land before the final is tagged instead of turning into a patch.
name: Release

on:
  push:
    tags: ["v*"]
  # So a tag that already exists can be published without inventing a new one.
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [publish, deprecate]
        default: publish
      dry_run:
        description: "publish: build and pack, but do not publish"
        type: boolean
        default: false
      deprecate_range:
        description: "deprecate: which versions, as a semver range"
        type: string
        default: "<4.0.0"
      deprecate_message:
        description: "deprecate: the notice npm shows on install (empty string clears it)"
        type: string
        default: "Superseded by 4.0.0. Versions before 4.0.0 were released under the MIT licence; from 4.0.0 mocanvas is source-available and commercial use requires an agreement - mocanvas@symbio.agency"

permissions:
  contents: read
  # Required: this is what lets npm verify the workflow's identity.
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing wants Node >= 22.14 and npm >= 11.5.1. Node 24
          # rather than 22.14 exactly, because current npm needs ^22.22 || ^24.15
          # and pinning the floor of one requirement broke the other.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node ships an npm older than trusted publishing needs.
      - run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # Build first: `packages/wasm/pkg` is wasm-pack output and is not in the
      # repository, so typecheck cannot resolve `@mocanvas/wasm` until it exists.
      - run: pnpm build

      # The gates that decide whether this is publishable at all. A release that
      # fails them should never reach the registry, and finding out here is much
      # cheaper than unpublishing — which npm mostly does not allow.
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The published API must still cover what tldraw's reference documents.
      - run: node apps/bench/scripts/api-coverage.mjs --reference

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/mocanvas/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi

      # Which dist-tag this version claims.
      #
      # pnpm publishes under `latest` by default WHATEVER the version is — there
      # is no prerelease special case — so `4.4.0-rc.1` published plainly would
      # become the version every consumer on `^4` installs. A release candidate
      # exists to be opted into, so it goes to `next` and leaves `latest` alone.
      #
      # This is what makes an early RC usable: a consumer whose supply-chain
      # policy refuses packages under a day old can install the RC the moment it
      # has aged, test against it while the final is still being worked on, and
      # never be handed it by a caret range in the meantime.
      - name: Work out the dist-tag
        id: disttag
        run: |
          ver=$(node -p "require('./packages/mocanvas/package.json').version")
          # A semver prerelease is anything carrying a `-`: 1.2.3-rc.1, -beta.0.
          case "$ver" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $ver under dist-tag '$tag'"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        # `--provenance` records where this build came from; trusted publishing
        # is what makes that attestation trustworthy.
        run: |
          pnpm -r --filter "./packages/*" publish \
            --access public --no-git-checks --provenance \
            --tag "${{ steps.disttag.outputs.tag }}"

      - name: Pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm -r --filter "./packages/*" pack --pack-destination /tmp/packs && ls -la /tmp/packs

      # Publishing seven packages has twice left the set half-updated when a
      # credential expired mid-run. This fails the job if that happens again,
      # rather than leaving a broken dependency graph for someone to find.
      - name: Verify every package published the same version
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          want="${{ steps.disttag.outputs.version }}"
          tag="${{ steps.disttag.outputs.tag }}"
          # The registry takes its time to serve a freshly published version, and
          # not evenly across packages. Poll rather than read once, and ask the
          # registry directly so a stale npm cache cannot answer for it.
          #
          # The budget is 15 minutes because this check has now cried wolf twice
          # on a perfectly good release. At 4.0.x six of seven were live and the
          # seventh arrived forty seconds later; at 4.2.0 six were live inside
          # eighty seconds and `store` took longer than the five minutes this
          # allowed, so a release that had published correctly reported failure.
          # A false red here is expensive in a way a slow green is not: the
          # packages are already public by this point, so the only thing a
          # premature failure changes is whether someone trusts the next one.
          for attempt in $(seq 1 60); do
            missing=""
            for p in mocanvas editor state store sync compat wasm; do
              got=$(curl -sS "https://registry.npmjs.org/@mocanvas%2f$p" \
                | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'][process.argv[1]]" "$tag" 2>/dev/null || echo missing)
              [ "$got" = "$want" ] || missing="$missing $p($got)"
            done
            [ -n "$missing" ] || { echo "all seven packages serve $want under '$tag' after $attempt attempt(s)"; exit 0; }
            echo "attempt $attempt/60 — still waiting for:$missing"
            sleep 15
          done
          echo "::error::After 15 minutes, these are still not serving $want under '$tag':$missing"
          echo "::error::The Publish step above SUCCEEDED, so this is either registry"
          echo "::error::propagation running long or a genuinely half-published set."
          echo "::error::Check with: npm view @mocanvas/<name> versions --json"
          echo "::error::If the versions are there, nothing needs republishing — the"
          echo "::error::artifacts are public and correct, and only this check is red."
          exit 1

  # Deprecating needs a credential the publish job does not have. Trusted
  # publishing mints an OIDC credential scoped to *publishing*: `npm deprecate`
  # with it returns 404 on the PUT, which is how the registry says "or you do not
  # have permission" without revealing whether a package exists. There is no OIDC
  # path for deprecate, so this job wants an `NPM_TOKEN` repository secret — a
  # granular token limited to the @mocanvas scope with read/write.
  #
  # Publishing stays tokenless. This is the one operation that cannot be, and it
  # runs a few times a year.
  #
  # Still a job in this file rather than its own workflow: npm ties a trusted
  # publisher to a workflow *file*, and splitting it would cost seven more
  # configurations on npmjs.com for no gain.
  deprecate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deprecate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Check the token is there
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set — see the comment above this job"
            exit 1
          fi

      - name: Deprecate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          fail=0
          for p in mocanvas editor state store sync compat wasm; do
            echo "--- @mocanvas/$p@${{ inputs.deprecate_range }}"
            npm deprecate "@mocanvas/$p@${{ inputs.deprecate_range }}" "${{ inputs.deprecate_message }}" || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::at least one deprecate failed"; exit 1; }

      - name: Show what each package now reports
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in mocanvas editor state store sync compat wasm; do
            echo "--- @mocanvas/$p"
            npm view "@mocanvas/$p" deprecated --json 2>/dev/null || echo "(none)"
          done
