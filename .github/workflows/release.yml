# Publish the packages to npm.
#
# Authentication is npm Trusted Publishing (OIDC): npm trusts this workflow, in
# this repository, and mints a short-lived credential for it. There is no token
# in the repository, in a secret, or on anyone's laptop — which is the point,
# and why this exists instead of an automation token.
#
# Trusted publishing only works from a CI provider's own runners, so this cannot
# be run locally. It replaces publishing by hand.
#
# Before the first run, each package needs a trusted publisher configured at
# npmjs.com → package → Settings → Trusted Publisher: GitHub Actions,
# SYMBIO/mocanvas, workflow `release.yml`.
name: Release

on:
  push:
    tags: ["v*"]
  # So a tag that already exists can be published without inventing a new one.
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [publish, deprecate]
        default: publish
      dry_run:
        description: "publish: build and pack, but do not publish"
        type: boolean
        default: false
      deprecate_range:
        description: "deprecate: which versions, as a semver range"
        type: string
        default: "<4.0.0"
      deprecate_message:
        description: "deprecate: the notice npm shows on install (empty string clears it)"
        type: string
        default: "Superseded by 4.0.0. Versions before 4.0.0 were released under the MIT licence; from 4.0.0 mocanvas is source-available and commercial use requires an agreement - mocanvas@symbio.agency"

permissions:
  contents: read
  # Required: this is what lets npm verify the workflow's identity.
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' || inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing wants Node >= 22.14 and npm >= 11.5.1. Node 24
          # rather than 22.14 exactly, because current npm needs ^22.22 || ^24.15
          # and pinning the floor of one requirement broke the other.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node ships an npm older than trusted publishing needs.
      - run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # Build first: `packages/wasm/pkg` is wasm-pack output and is not in the
      # repository, so typecheck cannot resolve `@mocanvas/wasm` until it exists.
      - run: pnpm build

      # The gates that decide whether this is publishable at all. A release that
      # fails them should never reach the registry, and finding out here is much
      # cheaper than unpublishing — which npm mostly does not allow.
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The published API must still cover what tldraw's reference documents.
      - run: node apps/bench/scripts/api-coverage.mjs --reference

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/mocanvas/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        # `--provenance` records where this build came from; trusted publishing
        # is what makes that attestation trustworthy.
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance

      - name: Pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm -r --filter "./packages/*" pack --pack-destination /tmp/packs && ls -la /tmp/packs

      # Publishing seven packages has twice left the set half-updated when a
      # credential expired mid-run. This fails the job if that happens again,
      # rather than leaving a broken dependency graph for someone to find.
      - name: Verify every package published the same version
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          want=$(node -p "require('./packages/mocanvas/package.json').version")
          # The registry takes a minute or two to serve a freshly published
          # version, and not evenly across packages — the first run of this check
          # failed while six of seven were already live and the seventh appeared
          # forty seconds later. Poll rather than read once, and ask the registry
          # directly so a stale npm cache cannot answer for it.
          for attempt in $(seq 1 20); do
            missing=""
            for p in mocanvas editor state store sync compat wasm; do
              got=$(curl -sS "https://registry.npmjs.org/@mocanvas%2f$p" \
                | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'].latest" 2>/dev/null || echo missing)
              [ "$got" = "$want" ] || missing="$missing $p($got)"
            done
            [ -n "$missing" ] || { echo "all seven packages are at $want"; exit 0; }
            echo "attempt $attempt — still waiting for:$missing"
            sleep 15
          done
          echo "::error::not every package reached $want:$missing"
          exit 1

  # Deprecating is a write to the registry like publishing, so it needs the same
  # credential — and npm ties a trusted publisher to a workflow *file*, not a job.
  # Hence a second job here rather than a second workflow: a `deprecate.yml` would
  # be an untrusted stranger and would need its own seven configurations.
  deprecate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deprecate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Deprecate
        run: |
          fail=0
          for p in mocanvas editor state store sync compat wasm; do
            echo "--- @mocanvas/$p@${{ inputs.deprecate_range }}"
            npm deprecate "@mocanvas/$p@${{ inputs.deprecate_range }}" "${{ inputs.deprecate_message }}" || fail=1
          done
          [ "$fail" = "0" ] || { echo "::error::at least one deprecate failed"; exit 1; }

      - name: Show what each package now reports
        run: |
          for p in mocanvas editor state store sync compat wasm; do
            echo "--- @mocanvas/$p"
            npm view "@mocanvas/$p" deprecated --json 2>/dev/null || echo "(none)"
          done
